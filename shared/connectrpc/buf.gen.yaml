version: v2

clean: true

inputs:
  - directory: proto
  - module: buf.build/googleapis/googleapis
    types:
      - google.rpc.BadRequest

plugins:
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative

  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative

  - local: protoc-gen-connect-dart
    out: gen/dart

  - local: protoc-gen-dart
    out: gen/dart
