syntax = "proto3";

package articles.v1;

// This proto module defines articles server
option go_package = "github.com/gogotchuri/readintent/backend/proto/articles/v1;articlesv1";

message PhonemizerTokenMeta {
  string text = 1;
  uint32 phoneme_len = 2;
  bool has_whitespace = 3;
}

message PhonemizerData {
  string graphemes = 1;
  string phonemes = 2;
  repeated int64 token_ids = 3;
  repeated PhonemizerTokenMeta token_meta = 4;
}
// Which list an article lives in. inbox and archive are mutually exclusive;
// favorite is an orthogonal flag (see is_favorite), not part of this enum.
enum ArticleListState {
  ARTICLE_LIST_STATE_UNSPECIFIED = 0; // treated as inbox
  ARTICLE_LIST_STATE_INBOX = 1;
  ARTICLE_LIST_STATE_ARCHIVE = 2;
}

// The view a GetArticles call is filtering for. favorite spans both inbox and
// archive (any article with is_favorite set).
enum ArticleView {
  ARTICLE_VIEW_UNSPECIFIED = 0; // defaults to inbox
  ARTICLE_VIEW_INBOX = 1;
  ARTICLE_VIEW_FAVORITE = 2;
  ARTICLE_VIEW_ARCHIVE = 3;
}

message ArticlePreview {
  int64 id = 1;
  // failed, processing, text_ready, ready
  string status = 2;
  string title = 3;
  string author = 4;
  string date = 5;
  string url = 6;
  repeated string categories = 7;
  // If the description failed to be extracted from the metadata,
  // we should add put the first few hundred characters in
  optional string description = 8;
  optional string image = 9;
  int64 player_position_ms = 10;
  double scroll_position = 11;
  ArticleListState list_state = 12;
  bool is_favorite = 13;
}

// Full article with all content
message Article {
  int64 id = 1;
  // failed, started_gathering, text_ready, ready
  string status = 2;
  string title = 3;
  string author = 4;
  string date = 5;
  string extracted_html = 6;
  string pure_text = 7;
  string url = 8;
  repeated string categories = 9;
  optional string description = 10;
  optional string image = 11;
  repeated PhonemizerData phonemizer_data = 12;
  int64 player_position_ms = 13;
  double scroll_position = 14;
  double playback_speed = 15;
  ArticleListState list_state = 16;
  bool is_favorite = 17;
}

message GetArticlesRequest {
  int32 page_size = 1;
  string page_token = 2;

  // Optional filters
  repeated string categories = 3;
  optional string search_query = 4;
  optional string author = 5;
  // Which list to fetch. Unspecified defaults to inbox.
  ArticleView view = 6;
}

message GetArticlesResponse {
  repeated ArticlePreview articles = 1;
  // Token for the cursor based pagination
  string next_page_token = 2;

  // Total number of articles matching the query
  int32 total_count = 3;
}

message GetArticleRequest { string id = 1; }

message GetArticleResponse { Article article = 1; }

message ParseArticleRequest { string url = 1; }

message ParseArticleResponse {}

message DeleteArticleRequest { string id = 1; }

message DeleteArticleResponse {}

// Moves an article between lists and/or toggles its favorite flag. Only the
// provided fields are changed, so list_state and is_favorite can be updated
// independently.
message SetArticleStateRequest {
  string id = 1;
  optional ArticleListState list_state = 2;
  optional bool is_favorite = 3;
}

message SetArticleStateResponse {}

message SaveArticleProgressRequest {
  string article_id = 1;
  int64 player_position_ms = 2;
  double scroll_position = 3;
  double playback_speed = 4;
}
message SaveArticleProgressResponse {}

message CheckForUpdatesRequest { int64 last_checked_at = 1; }

message CheckForUpdatesResponse {
  bool has_updates = 1;
  // Current server time - use this as next last_checked_at
  int64 server_timestamp = 2;
}

message StreamArticleUpdatesRequest {}

message StreamArticleUpdatesResponse {
  ArticlePreview article = 1;
  // "updated" | "heartbeat"
  string event_type = 2;
}

service ArticlesService {
  rpc ParseArticle(ParseArticleRequest) returns (ParseArticleResponse);
  rpc GetArticles(GetArticlesRequest) returns (GetArticlesResponse);
  rpc GetArticle(GetArticleRequest) returns (GetArticleResponse);
  rpc DeleteArticle(DeleteArticleRequest) returns (DeleteArticleResponse);
  rpc SetArticleState(SetArticleStateRequest) returns (SetArticleStateResponse);
  rpc CheckForUpdates(CheckForUpdatesRequest) returns (CheckForUpdatesResponse);
  rpc SaveArticleProgress(SaveArticleProgressRequest)
      returns (SaveArticleProgressResponse);
  // StreamArticleUpdates pushes the full updated ArticlePreview whenever an
  // article's status changes for the authenticated user.
  // Or send a Periodic heartbeat events tp keep the connection alive
  rpc StreamArticleUpdates(StreamArticleUpdatesRequest)
      returns (stream StreamArticleUpdatesResponse);
}
