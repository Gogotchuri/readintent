services:
  kratos-migrate:
    image: oryd/kratos:v25.4.0
    command: "-c /etc/config/kratos/kratos.yml migrate sql -e --yes"
    restart: on-failure
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    environment:
      - DSN=${KRATOS_DSN}
    networks:
      - intranet

  kratos:
    image: oryd/kratos:v25.4.0
    depends_on:
      - kratos-migrate
    command: "-c /etc/config/kratos/kratos.yml serve --dev --watch-courier"
    restart: unless-stopped
    ports:
      - '4433:4433' # public
      - '4434:4434' # admin
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    environment:
      - DSN=${KRATOS_DSN}
      - LOG_LEVEL=trace
    networks:
      - intranet

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - '4436:4436'
      - '4437:4437'
    networks:
      - intranet

  postgres:
    image: postgres:16-alpine
    user: postgres
    restart: always
    shm_size: 1024m
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        read_only: false
      - type: bind
        source: ./database/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
      - type: bind
        source: ./database/docker-initdb
        target: /docker-entrypoint-initdb.d
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    environment:
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - KRATOS_POSTGRES_PASSWORD=${KRATOS_POSTGRES_PASSWORD}
      - BFF_POSTGRES_PASSWORD=${BFF_POSTGRES_PASSWORD}
    networks:
      - intranet
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "localhost",
          "-p",
          "${POSTGRES_PORT}",
          "-U",
          "${POSTGRES_ADMIN_USER}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
networks:
  intranet: