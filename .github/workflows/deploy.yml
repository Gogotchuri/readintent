name: Deploy

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Determine target
        id: target
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          # Pin to the exact image built for this commit
          SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | head -c 7)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "master" ]; then
            echo "host=${{ secrets.PROD_SERVER_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env=prod" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "host=${{ secrets.DEV_SERVER_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH (blue-green flip)
        if: ${{ steps.target.outputs.skip != 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.target.outputs.host }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            /opt/readintent/deploy.sh "${{ steps.target.outputs.sha }}"
            docker image prune -f
