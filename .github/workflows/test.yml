name: Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      scraper: ${{ steps.filter.outputs.scraper }}
      phonemizer: ${{ steps.filter.outputs.phonemizer }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:    ['backend/**']
            scraper:    ['scraper/**']
            phonemizer: ['phonemizer/**']
            ui:         ['ui/**']

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Docker is preinstalled on ubuntu-latest -> testcontainers works.
      - run: ./test.sh backend

  scraper:
    needs: changes
    if: ${{ needs.changes.outputs.scraper == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: ./test.sh scraper

  phonemizer:
    needs: changes
    if: ${{ needs.changes.outputs.phonemizer == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (kokoro TTS)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng libsndfile1
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: ./test.sh phonemizer

  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The audio-player tests load two native libs over FFI via their unversioned
      # .so names: dart_lame -> libmp3lame.so (MP3 encoding) and drift/sqlite3 ->
      # libsqlite3.so (local persistence)
      - name: Install system deps (MP3 encoder, sqlite)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmp3lame-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./test.sh ui
