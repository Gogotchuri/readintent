services:
  kratos-migrate:
    image: oryd/kratos:v25.4.0
    command: "-c /etc/config/kratos/kratos.yml migrate sql -e --yes"
    restart: on-failure
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    environment:
      - DSN=postgres://kratos:kratos_secret@postgres:5432/kratos_db?sslmode=disable

  kratos:
    image: oryd/kratos:v25.4.0
    depends_on:
      - kratos-migrate
    command: "-c /etc/config/kratos/kratos.yml serve --dev --watch-courier"
    restart: unless-stopped
    ports:
      - '${KRATOS_PORT_ADMIN}:4434' # admin
      - '${KRATOS_PORT_PUBLIC}:4433' # public
    volumes:
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    environment:
      - DSN=postgres://kratos:kratos_secret@postgres:5432/kratos_db?sslmode=disable
      - LOG_LEVEL=trace
    healthcheck:
      test: ["CMD", "kratos", "remote", "status", "-e", "http://localhost:4434"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 1s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 1024m
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 1073741824 # 1GB
          mode: 1777 # The most permissive mode to avoid permission issues
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=kratos_secret
      - POSTGRES_DB=kratos_db
      - POSTGRES_PORT=5432
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "localhost",
          "-p",
          "5432",
          "-U",
          "kratos"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
